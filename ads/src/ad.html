<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Danca Way — reclamă</title>
<link rel="stylesheet" href="fonts.css">
<!--
  Un singur șablon pentru toate reclamele.
  ?c=1..4  concept   ·   ?f=4x5 | 1x1 | 9x16  format   ·   ?t=<sec> momentul afișat (pentru imagini)
  Video: window.__seek(t) randează cadrul de la secunda t (cadru cu cadru, determinist).
  9:16: textul și logo-ul stau între 14% și 65% din înălțime (sus și jos le acoperă interfața aplicației).
-->
<style>
  :root { --night:#0B1426; --navy:#0E1A36; --tile:#16223F; --light:#F5F6F8; --accent:#F2B705; --mist:rgba(255,255,255,.64); --muted:rgba(11,20,38,.62); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { overflow:hidden; background:var(--night); -webkit-font-smoothing:antialiased; }
  body { font-family:Geist, sans-serif; color:#fff; }
  #ad { position:relative; overflow:hidden; }
  #ad.dark { background:var(--night); color:#fff; } #ad.light { background:var(--light); color:var(--night); }
  .abs { position:absolute; }
  .h { font-weight:600; letter-spacing:-0.045em; line-height:.98; }
  .mono { font-family:"Geist Mono", monospace; }
  .label { font-family:"Geist Mono", monospace; font-weight:400; letter-spacing:.14em; text-transform:uppercase; }
  .dark .label, .dark .mist { color:var(--mist); } .light .label, .light .mist { color:var(--muted); }
  /* split-flap tiles */
  .flap { display:inline-flex; gap:.06em; perspective:1200px; }
  .tile { position:relative; display:inline-flex; align-items:center; justify-content:center; width:.74em; height:1.18em;
          border-radius:.09em; background:var(--tile); font-family:"Geist Mono", monospace; font-weight:600; line-height:1; transform-origin:50% 50%; }
  .tile::before { content:""; position:absolute; inset:0 0 50% 0; border-radius:.09em .09em 0 0; background:rgba(255,255,255,.035); }
  .tile::after { content:""; position:absolute; left:0; right:0; top:50%; height:.02em; min-height:2px; background:rgba(0,0,0,.55); }
  .tile.sep { background:none; width:.36em; } .tile.sep::before, .tile.sep::after { display:none; }
  .tile.sp { background:none; width:.36em; } .tile.sp::before, .tile.sp::after { display:none; }
  .light .tile { background:var(--night); color:#fff; }
  .rule { height:2px; background:rgba(255,255,255,.12); } .light .rule { background:rgba(11,20,38,.12); }
  .logo { display:block; }
  .snow i { position:absolute; width:6px; height:6px; border-radius:50%; background:#fff; }
  .cta { display:inline-flex; align-items:center; gap:18px; height:96px; padding:0 48px; border-radius:999px; background:#fff; color:var(--night); font-weight:600; font-size:38px; letter-spacing:-0.01em; }
  .seat { position:absolute; border-radius:22px; background:var(--night); }
  .seat.driver { background:none; border:4px solid rgba(11,20,38,.35); }
  .van { position:absolute; border:4px solid rgba(11,20,38,.18); border-radius:72px; }
</style>
</head>
<body>
<div id="ad"></div>
<script src="gsap.min.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const C = Number(Q.get("c") || 1), F = Q.get("f") || "4x5";
const SIZE = { "4x5": [1080, 1350], "1x1": [1080, 1080], "9x16": [1080, 1920] }[F];
const [W, H] = SIZE;
const ad = document.getElementById("ad");
ad.style.width = W + "px"; ad.style.height = H + "px";
document.body.style.width = W + "px"; document.body.style.height = H + "px";
// Usable area: on 9:16 keep clear of the top 14% and bottom 35%
const SAFE = F === "9x16" ? { top: Math.round(H * 0.14) + 24, bottom: Math.round(H * 0.65) - 24 } : { top: 88, bottom: H - 88 };
const PAD = 88;
const SWALLOW = "M55 32C52 36.5 46 37.5 40 35.5C42 46 34 57 17 62C25 53 28 44 28 35L17 33.5L0 46L10 32L0 18L17 30.5L28 29C28 20 25 11 17 2C34 7 42 18 40 28.5C46 26.5 52 27.5 55 32Z";
const BEAK = "M53.6 30.4L59.5 32L53.6 33.6C54.2 32.6 54.2 31.4 53.6 30.4Z";

const flapHTML = (text, cls = "", size = 100, color = "") =>
  `<span class="flap ${cls}" style="font-size:${size}px;${color ? `color:${color};` : ""}">${[...text].map((ch) =>
    `<span class="tile${ch === ":" ? " sep" : ch === " " ? " sp" : ""}" data-ch="${ch}">${ch}</span>`).join("")}</span>`;
// Everything except the end card lives in #stage, so the video can push in on the whole composition.
ad.insertAdjacentHTML("beforeend", `<div id="stage" style="position:absolute;inset:0;transform-origin:50% 50%"></div>`);
const stage = document.getElementById("stage");
const el = (html) => { stage.insertAdjacentHTML("beforeend", html); return stage.lastElementChild; };
const pos = (x, y, extra = "") => `left:${x}px;top:${y}px;${extra}`;

// Per format: vertical rhythm inside the safe area
const fit = (keys) => {
  // keys: list of [name, height]; distributes them top→bottom inside SAFE with even gaps
  const total = keys.reduce((a, [, h]) => a + h, 0);
  const gap = (SAFE.bottom - SAFE.top - total) / (keys.length - 1);
  let y = SAFE.top; const out = {};
  keys.forEach(([k, h]) => { out[k] = Math.round(y); y += h + gap; });
  return out;
};

const tl = gsap.timeline({ paused: true });
let HOLD = 0, DURATION = 0;
const flips = []; // split-flap animations rendered by hand (deterministic)
const addFlips = (root, start, opts = {}) => {
  root.querySelectorAll(".tile:not(.sep):not(.sp)").forEach((t, k) =>
    flips.push({ el: t, ch: t.dataset.ch, at: start + (opts.stagger ?? 0.045) * k + (opts.jitter ? ((k * 7) % 5) * 0.02 : 0), n: (opts.flips ?? 7) + ((k * 3) % 5) }));
};

/* ───────────── 1 · Departure board ───────────── */
function concept1() {
  ad.className = "dark";
  const big = F === "1x1" ? 210 : 250, hook = F === "1x1" ? 96 : 116, route = F === "1x1" ? 40 : 44;
  const L = fit(F === "1x1"
    ? [["lab", 32], ["hook", hook * 1.0], ["time", big * 1.18], ["route", route * 1.18], ["term", 40], ["logo", 56]]
    : [["lab", 32], ["hook", hook * 2.0], ["time", big * 1.18], ["route", route * 1.18], ["term", 40], ["logo", 64]]);
  el(`<p class="label abs" id="lab" style="${pos(PAD, L.lab, "font-size:32px")}">Plecări</p>`);
  el(`<h1 class="h abs" id="hook" style="${pos(PAD, L.hook, `font-size:${hook}px;width:${W - PAD * 2}px`)}">Zbori din${F === "1x1" ? " " : "<br>"}Otopeni?</h1>`);
  const time = el(`<div class="abs" id="time" style="${pos(PAD - 8, L.time)}">${flapHTML("05:00", "", big, "var(--accent)")}</div>`);
  const r = el(`<div class="abs" id="route" style="${pos(PAD, L.route)}">${flapHTML("TÂRGU NEAMȚ → OTOPENI", "", route, "#fff")}</div>`);
  r.querySelectorAll(".tile").forEach((t) => { t.style.width = ".66em"; });
  el(`<p class="abs mist" id="term" style="${pos(PAD, L.term, "font-size:40px;letter-spacing:-0.01em")}">Terminal Plecări</p>`);
  el(`<div class="abs" id="logoRow" style="${pos(PAD, L.logo, `width:${W - PAD * 2}px`)}"><div class="rule"></div><img class="logo" src="danca-way-logo-alb.svg" style="height:${F === "1x1" ? 40 : 46}px;margin-top:${F === "1x1" ? 16 : 18}px" alt=""></div>`);
  addFlips(time, 0.05, { flips: 9, stagger: 0.06 });
  addFlips(r, 0.12, { flips: 6, stagger: 0.022, jitter: true });
  tl.fromTo("#term", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "expo.out" }, 1.3);
  HOLD = 3.0;
  endCard(5.9, 8.0);
}

/* ───────────── 2 · Acasă de Crăciun ───────────── */
function concept2() {
  ad.className = "dark";
  const hook = F === "1x1" ? 96 : 108, big = F === "1x1" ? 104 : 116;
  const trailH = F === "9x16" ? 300 : F === "1x1" ? 300 : 400;
  const L = fit([["trail", trailH], ["hook", hook * 1.0], ["lab", 32], ["times", big * 1.18], ["logo", 56]]);
  // snow: sparse, quiet
  const snow = el(`<div class="snow abs" style="inset:0"></div>`);
  for (let i = 0; i < 46; i++) {
    const x = (i * 197) % W, y = (i * 331) % H, s = 3 + (i % 4) * 1.5;
    snow.insertAdjacentHTML("beforeend", `<i data-y="${y}" data-v="${18 + (i % 5) * 9}" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;opacity:${0.12 + (i % 3) * 0.08}"></i>`);
  }
  const x0 = PAD + 10, y0 = L.trail + trailH - 30, x1 = W - PAD - 70, y1 = L.trail + 40;
  const d = `M${x0} ${y0} C ${x0 + 260} ${y0 + 20}, ${x1 - 420} ${y1 + 220}, ${x1 - 160} ${y1 + 90} S ${x1 - 10} ${y1 + 10}, ${x1} ${y1}`;
  el(`<svg class="abs" style="left:0;top:0;overflow:visible" width="${W}" height="${H}">
        <defs><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><path id="tm" d="${d}" fill="none" stroke="#fff" stroke-width="24"/></mask></defs>
        <path id="trail" d="${d}" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 18" mask="url(#m)"/>
        <circle cx="${x0}" cy="${y0}" r="9" fill="#fff"/>
        <g id="bird"><g transform="scale(1.7) translate(-30 -32)"><path d="${SWALLOW}" fill="#fff"/><path d="${BEAK}" fill="#F2B705"/></g></g>
      </svg>`);
  el(`<p class="label abs" style="${pos(x0 + 64, y0 + 30, "font-size:32px")}">Otopeni</p>`);
  el(`<p class="label abs" id="neamt" style="${pos(x1 - 250, y1 - 22, "font-size:32px")}">Neamț</p>`);
  el(`<h1 class="h abs" id="hook" style="${pos(PAD, L.hook, `font-size:${hook}px`)}">De Crăciun, acasă.</h1>`);
  el(`<p class="label abs" id="lab" style="${pos(PAD, L.lab, "font-size:32px")}">Din Otopeni, zilnic</p>`);
  const times = el(`<div class="abs" id="times" style="${pos(PAD - 6, L.times, "display:flex;gap:40px")}">${flapHTML("12:00", "", big)}${flapHTML("16:00", "", big)}</div>`);
  el(`<div class="abs" style="${pos(PAD, L.logo, `width:${W - PAD * 2}px`)}"><div class="rule"></div><img class="logo" src="danca-way-logo-alb.svg" style="height:46px;margin-top:18px" alt=""></div>`);
  window.__trail = { d };
  window.__bird = { p: 1 };
  tl.fromTo(window.__bird, { p: 0 }, { p: 1, duration: 2.0, ease: "power2.inOut" }, 0.15);
  addFlips(times, 0.45, { flips: 8, stagger: 0.06 });
  tl.fromTo("#lab", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "expo.out" }, 0.3);
  tl.fromTo("#neamt", { opacity: 0.25 }, { opacity: 1, duration: 0.5 }, 2.0);
  HOLD = 2.6;
  endCard(5.9, 8.0);
}

/* ───────────── 3 · Microbuzul e doar al vostru (light) ───────────── */
function concept3() {
  ad.className = "light";
  const sq = F === "1x1";
  const hook = sq ? 88 : 104;
  const mapH = sq ? 560 : F === "9x16" ? 440 : 560;
  const L = sq ? fit([["hook", hook * 2], ["sub", 44], ["gap", 300], ["logo", 56]]) : fit([["hook", hook * 2], ["sub", 44], ["map", mapH], ["logo", 56]]);
  el(`<h1 class="h abs" style="${pos(PAD, L.hook, `font-size:${hook}px;width:${sq ? 560 : W - PAD * 2}px`)}">Microbuzul e doar al vostru.</h1>`);
  el(`<p class="abs mist" style="${pos(PAD, L.sub, "font-size:44px;letter-spacing:-0.02em")}">De acasă la Otopeni.</p>`);
  // seat map seen from above: driver + 8 seats (2 + 3 + 3), all eight yours
  const vw = Math.round(mapH * 0.66);
  const vx = sq ? W - PAD - vw : Math.round((W - vw) / 2);
  const vy = sq ? Math.round((H - mapH) / 2) - 10 : L.map;
  el(`<div class="van" style="left:${vx}px;top:${vy}px;width:${vw}px;height:${mapH}px"></div>`);
  el(`<div class="abs" style="left:${vx + Math.round(vw * 0.14)}px;top:${vy + Math.round(mapH * 0.07)}px;width:${Math.round(vw * 0.72)}px;height:4px;border-radius:2px;background:rgba(11,20,38,.18)"></div>`);
  const s = Math.round(vw * 0.22), g = Math.round(vw * 0.065);
  const cols = [0, 1, 2].map((i) => vx + Math.round((vw - (3 * s + 2 * g)) / 2) + i * (s + g));
  const rows = [0, 1, 2].map((j) => vy + Math.round(mapH * 0.15) + j * (Math.round(s * 1.08) + Math.round(g * 1.8)));
  rows.forEach((y, j) => cols.forEach((x, i) => {
    const driver = j === 0 && i === 0;
    el(`<div class="seat${driver ? " driver" : ""}" style="left:${x}px;top:${y}px;width:${s}px;height:${Math.round(s * 1.08)}px">${driver ? `<svg viewBox="0 0 40 40" style="position:absolute;inset:16%"><circle cx="20" cy="20" r="15" fill="none" stroke="rgba(11,20,38,.45)" stroke-width="3"/><circle cx="20" cy="20" r="3" fill="rgba(11,20,38,.45)"/><path d="M6 22h11M23 22h11M20 23v12" stroke="rgba(11,20,38,.45)" stroke-width="3"/></svg>` : ""}</div>`);
  }));
  el(`<span class="abs mono" style="${pos(vx + vw - (sq ? 120 : 70), vy - 30, "font-size:40px;font-weight:600;background:var(--accent);color:var(--night);padding:6px 20px;border-radius:999px")}">8+1</span>`);
  el(`<div class="abs" style="${pos(PAD, L.logo, `width:${sq ? 520 : W - PAD * 2}px`)}"><div class="rule"></div><img class="logo" src="danca-way-logo.svg" style="height:46px;margin-top:18px" alt=""></div>`);
  HOLD = 0;
}

/* ───────────── 4 · Preț clar ───────────── */
function concept4() {
  ad.className = "dark";
  const route = F === "1x1" ? 84 : 96, price = F === "1x1" ? 210 : 248, t = F === "1x1" ? 100 : 116;
  const L = fit([["route", route], ["price", price * 1.0], ["lab", 32], ["times", t * 1.18], ["logo", 56]]);
  el(`<h1 class="h abs" style="${pos(PAD, L.route, `font-size:${route}px`)}">Neamț – București</h1>`);
  el(`<div class="abs h" style="${pos(PAD - 6, L.price, "display:flex;align-items:baseline;gap:28px")}"><span class="mist" style="font-size:${Math.round(price * 0.24)}px;letter-spacing:-0.02em">de la</span><span style="font-size:${price}px;color:var(--accent);letter-spacing:-0.05em">120 lei</span></div>`);
  el(`<p class="label abs" style="${pos(PAD, L.lab, "font-size:32px")}">Din Roman</p>`);
  const times = el(`<div class="abs" id="times" style="${pos(PAD - 6, L.times, "display:flex;gap:48px")}">${flapHTML("06:00", "", t)}${flapHTML("07:45", "", t)}</div>`);
  el(`<div class="abs" style="${pos(PAD, L.logo, `width:${W - PAD * 2}px`)}"><div class="rule"></div><img class="logo" src="danca-way-logo-alb.svg" style="height:46px;margin-top:18px" alt=""></div>`);
  addFlips(times, 0.1);
  HOLD = 1.5;
}

/* End card for the videos: logo + CTA in the last two seconds */
function endCard(from, to) {
  DURATION = to;
  tl.fromTo("#stage", { scale: 1 }, { scale: 1.035, duration: from, ease: "none" }, 0);
  ad.insertAdjacentHTML("beforeend", "<div></div>");
  const card = ((html) => { ad.insertAdjacentHTML("beforeend", html); return ad.lastElementChild; })(`<div class="abs" id="end" style="inset:0;background:var(--night);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px">
      <img src="danca-way-logo-alb.svg" style="width:${F === "1x1" ? 560 : 640}px" alt="">
      <span class="cta" id="endCta">Scrie-ne pe WhatsApp</span>
      <span class="h" style="font-size:64px;letter-spacing:-0.03em">0725 819 224</span>
    </div>`);
  if (F === "9x16") { card.style.inset = "auto"; card.style.left = "0"; card.style.right = "0"; card.style.top = "0"; card.style.height = H + "px"; card.style.paddingBottom = Math.round(H * 0.2) + "px"; }
  tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, from);
  tl.fromTo("#end > *", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out", stagger: 0.12 }, from + 0.1);
}

[concept1, concept2, concept3, concept4][C - 1]();

/* ── deterministic render ── */
const hash = (a, b) => { let x = (a * 374761393 + b * 668265263) >>> 0; x = (x ^ (x >>> 13)) * 1274126177 >>> 0; return x; };
const DIG = "0123456789", LET = "ABCDEFGHIJKLMNOPRSTUVZ";
function render(t) {
  flips.forEach((f, i) => {
    const tau = t - f.at;
    const pool = /\d/.test(f.ch) ? DIG : LET;
    if (/[^0-9A-ZĂÂÎȘȚ]/.test(f.ch)) { f.el.textContent = f.ch; f.el.style.transform = ""; return; }
    if (tau < 0) { f.el.textContent = ""; f.el.style.transform = ""; return; } // blank tile until it flips
    const step = Math.floor(tau / 0.055);
    if (step < f.n) { f.el.textContent = pool[hash(i, step) % pool.length]; f.el.style.transform = `rotateX(${-60 + 60 * ((tau % 0.055) / 0.055)}deg)`; }
    else { f.el.textContent = f.ch; const q = Math.min(1, (tau - f.n * 0.055) / 0.5); f.el.style.transform = `rotateX(${-90 + 90 * (1 - Math.pow(2, -10 * q))}deg)`; }
  });
  if (window.__trail) {
    const path = document.getElementById("trail"), len = path.getTotalLength(), p = window.__bird.p;
    document.getElementById("tm").setAttribute("stroke-dasharray", len);
    document.getElementById("tm").setAttribute("stroke-dashoffset", len * (1 - p));
    const a = path.getPointAtLength(Math.max(0, p * len - 1)), b = path.getPointAtLength(Math.min(len, p * len + 1)), pt = path.getPointAtLength(p * len);
    document.getElementById("bird").setAttribute("transform", `translate(${pt.x} ${pt.y}) rotate(${Math.atan2(b.y - a.y, b.x - a.x) * 57.3})`);
    document.querySelectorAll(".snow i").forEach((s) => { s.style.transform = `translateY(${(t * +s.dataset.v) % 60}px)`; });
  }
}
window.__duration = DURATION;
window.__flips = flips.map((f) => [f.at, f.n]);
window.__hold = HOLD;
window.__seek = (t) => { tl.seek(Math.max(t, 0.0005), true); render(t); };
window.__ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]).then(() => {
  window.__seek(Q.has("t") ? Number(Q.get("t")) : HOLD + 2);
});
</script>
</body>
</html>
